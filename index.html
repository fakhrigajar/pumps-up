<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="ModShop" />
    <meta name="description" content="ModShop point of sale, inventory, sales reports, and store management." />
    <meta name="theme-color" content="#f9f9f7" />
    <title>ModShop</title>
    <script>
      // Apply the stored theme before first paint so a dark-mode reload never
      // flashes the light surface.
      ;(function () {
        try {
          document.documentElement.classList.toggle(
            'dark',
            localStorage.getItem('modshop.theme') === 'dark',
          )
        } catch (e) {
          /* private mode / storage disabled — fall back to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
